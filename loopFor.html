<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estruturas de repetição - For</title>

    <script>
        /* Diferente do laço de repetição while, onde precisamos declarar uma variavel contadora antes
            e apenas a condição como argumento do laço, no laço de repetição for teremos que declarar 
            como argumento: 

            - A inicialização da variável contadora;
            - A condição a ser obedecida;
            - O incremento a ser feito a cada repetição; 
        */

        // Declaração das variáveis
        let qtd = prompt('Digite a quantidade de notas')
        let nota = 0
        let soma = 0

        // Laço de repetição
        for(let contador = 1 ; contador <= qtd ; contador++){
            nota = Number(prompt('Digite a nota ' + contador))
            soma = soma + nota
            console.log('Nota ' + contador + ': ' + nota)
        }

        // Exibição da soma das notas
        console.log('Soma total: ' + soma)

        // Cálculo e exibição da média
        let media = soma / qtd
        console.log('Média final: ' + media)

        // Laço de condição para saber se foi Aprovado ou não
        if (media >= 7){
            console.log('Aprovado!')
        } else if (media < 5){
            console.log('Reprovado!')
        } else {
            console.log('Recuperação!')
        }

    </script>
</head>
<body>
    
</body>
</html>
